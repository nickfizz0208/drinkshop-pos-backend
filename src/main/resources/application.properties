spring.application.name=drinkshop-pos-backend
server.port=${PORT:8083}
server.address=${SERVER_ADDRESS:127.0.0.1}
spring.datasource.url=${POS_DB_URL:jdbc:mysql://localhost:3306/drinkshop_pos?serverTimezone=Asia/Taipei&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${POS_DB_USERNAME:root}
spring.datasource.password=${POS_DB_PASSWORD:}
spring.sql.init.mode=never
spring.config.import=optional:file:./.pos-local.properties
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.error.include-message=never
spring.jackson.deserialization.fail-on-unknown-properties=true
pos.photo-directory=${POS_PHOTO_DIRECTORY:./uploads/wastage}
pos.demo.enabled=false
pos.demo.password=${POS_DEMO_PASSWORD:}
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.disable-swagger-default-url=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
pos.store.lat=22.60388
pos.store.lng=120.29785
pos.here.map-key=${HERE_MAP_KEY:}
pos.here.api-key=${HERE_API_KEY:}

# 僅在資料庫負責人確認 009 已升級後於本機設定啟用，不會自動建表。
pos.raw-wastage.enabled=${POS_RAW_WASTAGE_ENABLED:false}
