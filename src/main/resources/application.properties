# \u901A\u8A0A\u57E0\u8A2D\u5B9A
server.port=8083

# MySQL \u9023\u7DDA\u8A2D\u5B9A\uFF08\u6539\u70BA quiz_1150720\uFF09
spring.datasource.url=jdbc:mysql://localhost:3306/quiz_1150720?serverTimezone=Asia/Taipei&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&useUnicode=true&characterEncoding=utf8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate SQL \u8F38\u51FA\u8207\u683C\u5F0F\u5316
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

# Local secret stays outside version control. Deployments should set JWT_SECRET (Base64, >=32 bytes).
spring.config.import=optional:file:./.jwt.properties
jwt.secret=${JWT_SECRET:${jwt.local-secret:}}
